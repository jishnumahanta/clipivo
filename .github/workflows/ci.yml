name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer"

      - name: Build (warnings are errors)
        run: |
          swift build 2>&1 | tee build.log
          if grep -q "warning:" build.log; then echo "::error::Build produced warnings"; exit 1; fi

      - name: Test
        run: swift test

      - name: Build app bundle
        run: scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Clipivo-unsigned-${{ github.sha }}
          path: dist/Clipivo.app
          retention-days: 7
